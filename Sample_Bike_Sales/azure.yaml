# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: bike-sales-api
metadata:
  template: bike-sales-api@0.0.1
# services:
#   api:
#     project: ./app/api
#     language: py
#     host: appservice
hooks:
  prepackage:
    shell: sh
    run: |
      echo "Copying CSV data files into the deployment package..."
      mkdir -p app/api/data
      cp *.csv app/api/data/
      echo "Done – $(ls app/api/data/*.csv | wc -l | tr -d ' ') CSV files copied."
  postprovision:
    shell: sh
    run: |
      set -eu

      APP_DIR="app/api"
      # PYTHON_VERSION="3.12"
      WEBAPP_NAME="${SERVICE_API_NAME:-${AZURE_WEBAPP_NAME:-}}"
      RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:-}"

      if [ -z "$WEBAPP_NAME" ]; then
        echo "Missing web app name. Expected SERVICE_API_NAME or AZURE_WEBAPP_NAME in the environment."
        exit 1
      fi

      if [ -z "$RESOURCE_GROUP" ]; then
        echo "Missing resource group. Expected AZURE_RESOURCE_GROUP in the environment."
        exit 1
      fi

      DEPLOY_ZIP="$(mktemp -t bike-sales-api-XXXXXX).zip"

      echo "Packaging API from $APP_DIR..."
      (
        cd "$APP_DIR"
        zip -rq "$DEPLOY_ZIP" . \
          -x ".venv/*" \
          -x "__pycache__/*" \
          -x "*.pyc" \
          -x ".pytest_cache/*"
      )

      # echo "Configuring $WEBAPP_NAME to use Python $PYTHON_VERSION..."
      # az webapp config set \
      #   --name "$WEBAPP_NAME" \
      #   --resource-group "$RESOURCE_GROUP" \
      #   --linux-fx-version "PYTHON|$PYTHON_VERSION"

      echo "Deploying API package to $WEBAPP_NAME..."
      az webapp deploy \
        --name "$WEBAPP_NAME" \
        --resource-group "$RESOURCE_GROUP" \
        --src-path "$DEPLOY_ZIP" \
        --type zip \
        --clean true

      rm -f "$DEPLOY_ZIP"

      echo "------------------------------------------------------------"
      echo "Provisioning complete."
      echo ""
      echo "Deployment complete for web app: $WEBAPP_NAME"
      echo ""
      echo "To enable Entra ID authentication, set these env vars on the"
      echo "App Service (or in a .env file for local dev):"
      echo ""
      echo "  AZURE_TENANT_ID=<your-tenant-id>"
      echo "  AZURE_CLIENT_ID=<your-app-registration-client-id>"
      echo "  AZURE_API_AUDIENCE=api://<your-app-registration-client-id>"
      echo ""
      echo "Without these, the API runs with auth DISABLED (open access)."
      echo "------------------------------------------------------------"
